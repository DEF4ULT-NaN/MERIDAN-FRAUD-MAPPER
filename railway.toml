# Railway deploy config for the Fraud Network Mapper backend.
# MUST live at the repo root for Railway (and Railpack) to find it.
# The Dockerfile stays at backend/Dockerfile; build context is ".".

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
buildContext = "."

[deploy]
# Start command. Use the entrypoint script (not uvicorn directly) so $PORT
# resolves at runtime and SIGTERM reaches uvicorn for clean shutdowns.
startCommand = "/entrypoint.sh"

# Healthcheck. /health returns 200 + {status:"ok", model_loaded:true,...}.
# Start period 120s is generous — covers the first-boot PyTorch load
# (subsequent boots are ~7s).
healthcheckPath = "/health"
healthcheckTimeout = 120
healthcheckStartPeriod = 120

# Restart policy — if uvicorn crashes (bad request, OOM, etc), restart
# up to 3 times before Railway marks the deploy as failed.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Watch paths — changes to these trigger a redeploy.
watchPatterns = [
  "backend/**/*.py",
  "backend/Dockerfile",
  "backend/.dockerignore",
  "models/**",
  "data/samples/**",
  "scripts/**",
  "railway.toml",
]